    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — restoration half of the pattern
      // in public/404.html (see that file's comment for the full picture).
      // Runs before the app bundle (script tags execute in document order,
      // and this one is a plain synchronous script above the module script
      // below) so BrowserRouter/basename never sees the temporary encoded
      // URL 404.html produced — only the real original path, restored here
      // via history.replaceState (no reload, no second navigation).
      //
      // A visit that was never redirected through 404.html has a query
      // string that doesn't start with "/" (or no query string at all), so
      // the `l.search[1] === '/'` check below leaves those completely
      // untouched — this only ever does something after a genuine 404
      // redirect.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
